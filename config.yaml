# Job agent configuration. Secrets never go here — see .env.example.

resume_path: resume.md          # master resume, never edited by the agent
db_path: jobs.db                # SQLite, tracks every job seen and what was done
out_dir: out                    # tailored resumes: out/<company>_<jobid>/

llm:
  provider: ollama              # gemini | ollama — one class each in job_agent/llm/
  gemini:
    model: gemini-3.8-flash     # GEMINI_API_KEY from env; free tier. gemini-2.5-flash is deprecated (routes
                                # to 3.5-flash-lite on 2026-12-01). Fallback if rate-limited: gemini-3.6-flash
  ollama:
    model: qwen3.5:9b           # 6.6 GB Q4_K_M; `ollama pull qwen3.5:9b` first. Smaller/faster: qwen3.5:4b
    url: http://localhost:11434
    think: false                # true = model reasons before answering: ~12x slower per call, same scores in tests

notify:
  to: iayush45@gmail.com        # SMTP_USER / SMTP_APP_PASSWORD from env (Gmail app password)

roles:
  include:                      # title must contain one of these (case-insensitive)
    - software engineer
    - software developer
    - software development engineer
    - sde
    - backend engineer
    - back end engineer
    - full stack
    - member of technical staff
    - application developer
    - platform engineer
    - ai engineer
    - machine learning engineer
  exclude:                      # title must not contain any of these
    - principal
    - director
    - manager
    - intern
    - campus                    # campus/university hiring programmes are not wanted; SDE-1 full-time is the floor
    - architect
    - staff engineer
    - staff software
    - vice president
  # Level from the title: "SDE II" / "Engineer 2" = 2, "Senior" / "III" = 3, anything else = 1 (SDE-1).
  # The JD is also checked by the scorer: roles asking 3+ years or SDE-2 duties score low outside level_2_ok_at.
  max_level: 1
  level_2_ok_at: [Microsoft, ServiceNow, Salesforce]

locations:
  job_cities: [Hyderabad, Bangalore, Noida, Gurugram, Pune]   # priority order; used to rank matches
  include_remote: true                                        # remote (India) jobs count too
  company_must_have_office_in: [Bangalore, Hyderabad]        # Group B company filter (phase 2)

match:
  min_score: 65                 # Claude's 0-100 fit score needed to notify

tailor:
  # Skills the agent may add when a JD asks for them. Two kinds:
  #   exact      – added only if the JD names this term
  #   categories – the agent decides per JD whether a JD term fits the category
  #                (e.g. JD says "Redshift" → fits "any SQL database"); every such
  #                addition is listed in the email with the category it matched
  skills_allowed_to_add:
    exact: [Flask, Django, Redis, MongoDB, GraphQL, Apache Spark, PySpark,
            Agentic AI, Transformer models, Concurrency, POSIX]
    categories:
      - any SQL database or dialect
      - any RAG / LLM-orchestration framework

screening:                      # fixed answers for application forms (phase 2)
  notice_period_days: 45
  current_ctc_lpa: 8
  expected_ctc:
    min_lpa: 12
    preferred_lpa: 14
    mode: company_average
  willing_to_relocate: true

applicant:                      # what goes into application forms (answers given 2026-11-10)
  first_name: Ayush
  last_name: Kshitij
  email: iayush45@gmail.com
  phone: "+91 7318367493"
  location: Panjim, Goa, India
  linkedin: https://www.linkedin.com/in/ayush-kshitij
  github: https://github.com/AyushKshitij45
  years_experience: 2           # internships + job; 6 months of it full-time
  current_company: Acies
  current_title: Software Engineer
  work_authorized: "Yes"        # Indian citizen
  needs_sponsorship: "No"
  heard_about_us: Company careers site
  gender: Male
  disability: "No"
  veteran: "No"
  cover_letter: skip            # optional field left empty; mandatory one = unanswered question -> you get emailed
  address: CMM Building, Panjim, Goa, 403005   # for forms that require a street address (Zscaler does)
  # earliest start date = today + screening.notice_period_days
  # any other question the form asks -> not submitted; emailed with "NEEDS YOUR ANSWER" in the subject

education:                      # from resume.md; forms with School / Degree dropdowns use these
  school: Kalinga Institute of Industrial Technology
  degree: Bachelor of Technology
  discipline: Computer Science
  end_year: 2026
  gpa: "8.11"

apply:
  dry_run: true                 # true = fill the form, attach a screenshot (form.png), do NOT submit.
                                # Check one or two screenshots, then set false to let it submit.

